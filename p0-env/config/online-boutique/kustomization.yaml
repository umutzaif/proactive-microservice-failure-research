apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-boutique
resources:
  - ../../source/microservices-demo/kustomize/base
  - namespace.yaml
  - observability.yaml
patches:
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
  - target:
      kind: Deployment
      name: checkoutservice|currencyservice|emailservice|frontend|paymentservice|productcatalogservice|recommendationservice
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: COLLECTOR_SERVICE_ADDR
          value: opentelemetrycollector:4317
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENABLE_TRACING
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DISABLE_PROFILER
          value: "1"
